# Publishes mcp/ to npm with provenance. Runs on manual dispatch or a pushed mcp-v* tag only.
name: mcp-publish
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish x402-research-mcp'
        required: true
permissions:
  contents: read
  id-token: write   # required for npm --provenance
jobs:
  publish:
    if: github.event.inputs.confirm == 'publish' || startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
